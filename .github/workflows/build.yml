name: Build

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  apk:
    uses: ./.github/workflows/build-apk.yml
    secrets: inherit

  ntoveraoa-linux:
    uses: ./.github/workflows/build-NTOverAOA-linux.yml

  ntoveraoa-windows:
    uses: ./.github/workflows/build-NTOverAOA-windows.yml

  package:
    needs:
      - apk
      - ntoveraoa-linux
      - ntoveraoa-windows
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            LICENSE
            LIBWDI-LICENSE

      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: android-debug-apk
          path: bundles/apk

      - name: Download Linux x86_64 executable
        uses: actions/download-artifact@v8
        with:
          name: NTOverAOA-linux-x86_64
          path: bundles/linux-x86_64

      - name: Download Linux ARM64 executable
        uses: actions/download-artifact@v8
        with:
          name: NTOverAOA-linux-arm64
          path: bundles/linux-arm64

      - name: Download Windows executable
        uses: actions/download-artifact@v8
        with:
          name: NTOverAOA-windows-x86_64
          path: bundles/windows

      - name: Package per-platform bundles
        run: |
          set -euo pipefail

          apk="$(
            find bundles/apk -name '*.apk' -type f -print -quit
          )"
          if [ -z "${apk}" ]; then
            echo "No APK found in the android-debug-apk artifact" >&2
            exit 1
          fi

          # Create license notice
          cat > LICENSE-NOTICE.txt << 'EOF'
          License Notice

          The RoboRoute APK is licensed under the MIT License (see LICENSE).
          NTOverAOA is licensed under the MIT License (see LICENSE).

          NTOverAOA uses libwdi (https://github.com/pbatard/libwdi) for windows device driver configuration, which is
          licensed under the GNU Lesser General Public License v3.0 (see LIBWDI-LICENSE).
          EOF

          mkdir -p packages

          cp "$apk" bundles/windows/RoboRoute.apk
          cp LICENSE bundles/windows/
          cp LIBWDI-LICENSE bundles/windows/
          cp LICENSE-NOTICE.txt bundles/windows/
          (
            cd bundles/windows
            zip -r "../../packages/RoboRoute-windows-x86_64.zip" \
              NTOverAOA.exe RoboRoute.apk LICENSE LIBWDI-LICENSE LICENSE-NOTICE.txt
          )

          cp "$apk" bundles/linux-x86_64/RoboRoute.apk
          cp LICENSE bundles/linux-x86_64/
          cp LIBWDI-LICENSE bundles/linux-x86_64/
          cp LICENSE-NOTICE.txt bundles/linux-x86_64/
          (
            cd bundles/linux-x86_64
            tar -czf "../../packages/RoboRoute-linux-x86_64.tar.gz" \
              NTOverAOA-linux-x86_64.run RoboRoute.apk LICENSE LIBWDI-LICENSE LICENSE-NOTICE.txt
          )

          cp "$apk" bundles/linux-arm64/RoboRoute.apk
          cp LICENSE bundles/linux-arm64/
          cp LIBWDI-LICENSE bundles/linux-arm64/
          cp LICENSE-NOTICE.txt bundles/linux-arm64/
          (
            cd bundles/linux-arm64
            tar -czf "../../packages/RoboRoute-linux-arm64.tar.gz" \
              NTOverAOA-linux-arm64.run RoboRoute.apk LICENSE LIBWDI-LICENSE LICENSE-NOTICE.txt
          )

          ls -la packages

      - name: Upload bundles
        uses: actions/upload-artifact@v7
        with:
          name: RoboRoute-bundles
          path: packages/*
          if-no-files-found: error